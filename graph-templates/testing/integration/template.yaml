id: testing.integration
name: Integration Test Database Setup
version: 1.0.0
description: >
  Tests that hit a REAL Postgres database, as opposed to testing.unit's
  mocked repository layer. Provides a testDatabase helper that connects to
  TEST_DATABASE_URL and truncates every application table between tests,
  with a loud refusal to run against NODE_ENV=production or a missing
  TEST_DATABASE_URL fallback to the real DATABASE_URL.
category: testing
subcategory: integration
status: implemented
type: graph-node
actions: [generate, detect, validate, test]

inputs: []

outputs:
  - { name: files, type: array<string>, description: "tests/setup/testDatabase.ts" }
  - { name: exports, type: array<string>, description: "getTestDatabase, truncateAllTables" }

dependencies:
  packages: []
  services: [postgres]
  templates:
    - { id: database.neon-postgres.connection, relationship: requires }

environment:
  variables:
    - { name: TEST_DATABASE_URL, required: false, secret: true, description: "Connection string for a disposable test database. If unset, falls back to DATABASE_URL with a loud console warning.", usedBy: [testing.integration] }

files:
  create:
    - { path: tests/setup/testDatabase.ts, source: files/testDatabase.ts }
  modify: []

compatible_with:
  upstream: [database.neon-postgres.connection]
  downstream: [backend.repository, api.crud]

consumes:
  artifacts: [database.schema]
produces:
  artifacts: [test.schema]

idempotency:
  strategy: detect-and-skip
  detection: "tests/setup/testDatabase.ts exists"

validation:
  checks:
    - { type: file-exists, path: tests/setup/testDatabase.ts }
    - { type: exports, path: tests/setup/testDatabase.ts, names: [getTestDatabase, truncateAllTables] }
    - { type: build, command: "npm run build" }

testing:
  strategy: integration
  location: tests/testDatabase.test.ts
  command: "npm test -- testDatabase"

security:
  considerations:
    - "getTestDatabase() throws immediately if NODE_ENV === 'production' — truncateAllTables is destructive by design (it deletes every row in every application table) and must never be reachable in a production process."
    - "If TEST_DATABASE_URL is unset, this node falls back to DATABASE_URL but only after printing a console.warn naming the risk — silent fallback to a possibly-real database would be a data-loss trap, so it is intentionally noisy instead of intentionally blocked (blocking would make local dev without a second database impossible; noisy-but-allowed is the deliberate tradeoff)."

documentation:
  required: [README.md]
