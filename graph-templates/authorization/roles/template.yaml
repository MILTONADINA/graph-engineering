id: authorization.roles
name: Dynamic Role Definitions
version: 0.1.0
description: >
  Application-defined, runtime-configurable roles (a roles table + role
  assignment) as opposed to authorization.rbac's hardcoded customer/admin
  enum — for applications that need to let an admin create new roles without
  a code change/migration. Not yet implemented in this library.
category: authorization
subcategory: roles
status: planned
type: graph-node
actions: [generate]

inputs: []
outputs: []

dependencies:
  packages: []
  services: []
  templates:
    - { id: authorization.rbac, relationship: extends }
    - { id: database.neon-postgres.connection, relationship: requires }

environment:
  variables: []

files:
  create: []
  modify: []

compatible_with:
  upstream: [authentication.jwt, database.neon-postgres.connection]
  downstream: []

consumes:
  artifacts: []
produces:
  artifacts: [auth.schema]

idempotency:
  strategy: detect-and-skip
  detection: "not applicable — planned"

validation:
  checks: []

testing:
  strategy: none

security:
  considerations:
    - "Runtime-defined roles widen the attack surface versus a fixed enum — role creation/assignment endpoints must themselves be tightly permissioned once implemented (a privilege-escalation risk if under-protected)."

documentation:
  required: []
