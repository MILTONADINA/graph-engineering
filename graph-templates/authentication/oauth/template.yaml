id: authentication.oauth
name: OAuth2 Login (Google/GitHub)
version: 0.1.0
description: >
  Third-party OAuth2 login (Google/GitHub, etc.). Not yet implemented in this
  library. Once built, it would extend authentication.jwt rather than replace
  it: after a successful OAuth callback, it issues the same access/refresh
  tokens authentication.jwt already defines, skipping password verification
  entirely for that login path.
category: authentication
subcategory: oauth
status: planned
type: graph-node
actions: [generate]

inputs: []
outputs: []

dependencies:
  packages: []
  services: [oauth-provider]
  templates:
    - { id: authentication.jwt, relationship: extends }

environment:
  variables: []

files:
  create: []
  modify: []

compatible_with:
  upstream: [authentication.jwt]
  downstream: []

consumes:
  artifacts: []
produces:
  artifacts: [auth.schema]

idempotency:
  strategy: detect-and-skip
  detection: "not applicable — planned"

validation:
  checks: []

testing:
  strategy: none

security:
  considerations:
    - "State/PKCE handling for the OAuth callback is the primary security surface once implemented — not yet designed."

documentation:
  required: []
