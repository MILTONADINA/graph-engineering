id: api.search
name: Full-Text / Fuzzy Search
version: 0.1.0
description: >
  Genuinely distinct future capability (Postgres tsvector/pg_trgm full-text or
  fuzzy search across one or more entities) — not implemented; not faked as a
  thin wrapper over api.crud's exact-match filtering, which it is not a
  substitute for. Planned: a search index column/migration, a query-parsing
  node analogous to backend.pagination, and a ranked-results response shape
  distinct from api.schema.json's plain route list.
