id: database.neon-postgres.connection
name: Neon PostgreSQL Connection (Drizzle)
version: 1.0.0
description: >
  The Neon serverless Postgres connection layer, taken directly from the
  reference app's src/config/database.ts and drizzle.config.ts: a WebSocket-
  backed Pool wrapped by drizzle-orm's neon-serverless driver, plus the base
  (table-free) schema.ts that backend.repository nodes append pgTable
  definitions to, and drizzle-kit configuration for migrations.
category: database
subcategory: neon-postgres
status: implemented
type: graph-node
actions: [generate, detect, validate, test]

inputs: []

outputs:
  - { name: files, type: array<string>, description: "src/config/database.ts, src/config/schema.ts, drizzle.config.ts" }
  - { name: exports, type: array<string>, description: "database, pool" }

dependencies:
  packages:
    - { name: "@neondatabase/serverless", version: "^0.9.4" }
    - { name: drizzle-orm, version: "^0.33.0" }
    - { name: ws, version: "^8.21.3" }
    - { name: "@types/ws", version: "^8.18.1", dev: true }
    - { name: drizzle-kit, version: "^0.24.2", dev: true }
  services: [postgres]
  templates:
    - { id: project.node-express, relationship: requires }

environment:
  variables:
    - { name: DATABASE_URL, required: true, secret: true, description: "Neon pooled Postgres connection string. Accepts NEON_DATABASE_URL as an alias, matching the reference app's convention.", usedBy: [database.neon-postgres.connection] }

files:
  create:
    - { path: src/config/database.ts, source: files/database.ts }
    - { path: src/config/schema.ts, source: files/schema.ts }
    - { path: drizzle.config.ts, source: files/drizzle.config.ts }
  modify:
    - { path: src/utils/helpers.ts, operation: insert-before-marker, marker: "// ENV-VAR-FIELDS:", template: "  DATABASE_URL: string;" }
    - { path: src/utils/helpers.ts, operation: insert-into-array, marker: "requiredEnvironmentVariables", template: "'DATABASE_URL'" }
    - { path: src/utils/helpers.ts, operation: insert-before-marker, marker: "// ENV-VAR-VALUES:", template: "  DATABASE_URL: process.env.NEON_DATABASE_URL ?? process.env.DATABASE_URL!," }
    - { path: package.json, operation: merge-json, template: "{ \"scripts\": { \"dbGenerate\": \"drizzle-kit generate\", \"dbMigrate\": \"drizzle-kit migrate\" } }" }

compatible_with:
  upstream: [project.node-express]
  downstream: [backend.repository, database.migrations, database.transactions, database.seed]

consumes:
  artifacts: [architecture.schema]
produces:
  artifacts: [database.schema]

idempotency:
  strategy: detect-and-skip
  detection: "src/config/database.ts exists and exports database"

validation:
  checks:
    - { type: file-exists, path: src/config/database.ts }
    - { type: file-exists, path: src/config/schema.ts }
    - { type: file-exists, path: drizzle.config.ts }
    - { type: exports, path: src/config/database.ts, names: [database, pool] }
    - { type: build, command: "npm run build" }

testing:
  strategy: unit
  location: tests/database-connection.test.ts
  command: "npm test -- database-connection"

security:
  considerations:
    - "DATABASE_URL is a secret — never logged, never committed; only referenced via SECRETS which reads it from process.env."
    - "neonConfig.webSocketConstructor = ws is required because @neondatabase/serverless assumes a WebSocket global that only exists natively in edge/browser runtimes, not plain Node — omitting it breaks the Pool in this stack."
    - "The Pool is a module-level singleton (one per process) — never construct a second Pool for the same DATABASE_URL, which would exhaust Neon's connection limits under load."

documentation:
  required: [README.md]
