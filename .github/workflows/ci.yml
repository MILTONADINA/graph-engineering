name: Platform checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, "feat/**", "fix/**", "chore/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm ci --prefix graph-templates/tools/validate-graph
      - run: npm test --prefix graph-templates/tools/validate-graph
      - run: npm run pack:check -w create-graph-app
      - name: Docker execution integration
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker pull node:24-alpine
          npm test -w @graph-engineering/engine -- --run tests/execution.test.ts
        env:
          GRAPH_ENGINE_DOCKER_TESTS: "1"
      - name: Evaluation fixture self-checks
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          node --test evaluation/runner.test.mjs evaluation/validate-historical-corpus.test.mjs
          node evaluation/calibration-corpus.mjs validate
        env:
          GRAPH_ENGINE_HISTORY_TESTS: "1"
      - name: Snapshot-only Go compiler bindings
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker pull golang@sha256:d2d2bc1c84f7e60d7d2438a3836ae7d0c847f4888464e7ec9ba3a1339a1ee804
          npm run verify:image
          npm test -w @graph-engineering/engine -- --run tests/context-go.test.ts
          docker build --pull=false --network=none -f packages/engine/tests/fixtures/go-runtime/Dockerfile -t graph-go-native-test:local .
          docker run --rm --network=none --read-only --tmpfs /tmp:rw,exec,nosuid,size=768m --memory=1536m --cpus=2 --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges graph-go-native-test:local
        env:
          GRAPH_ENGINE_GO_DOCKER_TESTS: "1"
      - name: Generated backend template integration
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker build -t graph-backend-template-test:local packages/engine/tests/fixtures/backend-runtime
          docker pull node:24-bookworm-slim
          npm test -w @graph-engineering/engine -- --run tests/template-runtime-backend.test.ts tests/template-runtime-crud.test.ts tests/template-runtime-devops.test.ts tests/template-runtime.test.ts
        env:
          GRAPH_ENGINE_BACKEND_DOCKER_TESTS: "1"
          GRAPH_ENGINE_DOCKER_TESTS: "1"
      - name: Generated testing templates and isolated PostgreSQL
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker build -t graph-testing-template-test:local packages/engine/tests/fixtures/testing-runtime
          npm test -w @graph-engineering/engine -- --run tests/template-runtime-testing.test.ts
        env:
          GRAPH_ENGINE_TESTING_DOCKER_TESTS: "1"
      - name: Generated authentication with isolated PostgreSQL races
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker build -f packages/engine/tests/fixtures/auth-db-runtime/Dockerfile -t graph-auth-template-db-test:local packages/engine/tests/fixtures
          npm test -w @graph-engineering/engine -- --run tests/template-runtime-auth.test.ts
        env:
          GRAPH_ENGINE_BACKEND_DOCKER_TESTS: "1"
          GRAPH_ENGINE_AUTH_POSTGRES_TESTS: "1"
      - name: Generated database lifecycle with isolated PostgreSQL
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker build -t graph-database-template-test:local packages/engine/tests/fixtures/database-runtime
          npm test -w @graph-engineering/engine -- --run tests/template-runtime-database.test.ts
        env:
          GRAPH_ENGINE_DATABASE_DOCKER_TESTS: "1"
      - name: Generated storage authorization and SDK signing
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker build -t graph-storage-template-test:local packages/engine/tests/fixtures/storage-runtime
          npm test -w @graph-engineering/engine -- --run tests/template-runtime-storage.test.ts
        env:
          GRAPH_ENGINE_STORAGE_DOCKER_TESTS: "1"
      - name: Generated Express scaffold and compiled server
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker build -t graph-project-template-test:local packages/engine/tests/fixtures/project-runtime
          npm test -w @graph-engineering/engine -- --run tests/template-runtime-project.test.ts
        env:
          GRAPH_ENGINE_PROJECT_DOCKER_TESTS: "1"
      - name: Generated frontend build and browser integration
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker build -t graph-frontend-template-test:local packages/engine/tests/fixtures/frontend-runtime
          npm test -w @graph-engineering/engine -- --run tests/template-runtime-frontend.test.ts
        env:
          GRAPH_ENGINE_FRONTEND_DOCKER_TESTS: "1"
      - name: Generated full-stack authentication with real PostgreSQL and Chromium
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          docker build -f packages/engine/tests/fixtures/fullstack-runtime/Dockerfile -t graph-fullstack-template-test:local packages/engine/tests/fixtures
          npm test -w @graph-engineering/engine -- --run tests/template-runtime-fullstack.test.ts
        env:
          GRAPH_ENGINE_FULLSTACK_DOCKER_TESTS: "1"
      - name: Platform dashboard browser integration
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:fixture -w @graph-engineering/dashboard

  generated-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w create-graph-app
      - run: node create-graph-app/scripts/smoke-generated-apps.js

  sidecar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s sidecars/laya -p 'test_*.py' -v
